# ============================================================
#  ansible.cfg — Configuração do Ansible para o projeto
#
#  Este arquivo é lido automaticamente pelo Ansible quando
#  executado a partir do diretório projeto-terraform/.
# ============================================================

[defaults]
# Desabilita verificação de host key SSH.
# Necessário em ambientes de lab onde as VMs são recriadas
# frequentemente e os fingerprints mudam a cada terraform apply.
# Em produção, mantenha como True e gerencie o known_hosts.
host_key_checking = False

# Caminho padrão do inventário — evita ter que passar -i sempre
inventory = ansible/hosts.ini

# Exibe saída colorida e legível
stdout_callback = yaml

# Não cria arquivos .retry após falha
retry_files_enabled = False

[ssh_connection]
# Reutiliza conexões SSH entre tasks (mais rápido)
pipelining = True
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
